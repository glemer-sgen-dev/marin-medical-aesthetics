# nginx redirect rules — marinmedicalaesthetics.com
#
# Server-level alternative to the WordPress-layer rules. Production is nginx +
# PHP 8.3 + WordPress on Plesk (verified 2026-08-25 from response headers), and
# the two redirects already in force are done by WordPress itself
# (X-Redirect-By: WordPress), so the plugin route in redirects.csv matches the
# existing mechanism. Use ONE of the two, not both.
#
# An .htaccess would be INERT here: the host runs nginx, not Apache.
#
# Include inside the server { } block, above the WordPress try_files fallback,
# or exact-match locations will never be reached.
#
# SCOPE: same-domain rows only. The eight cross-domain rows in the ordinance are
# WITHDRAWN — ownership of marinskinrejuvenation.com and marinbodysculpt.com is
# unestablished and F4 was waived, so no redirect may be authored against either
# domain. marinincontinencetherapy.com is a deliberate recorded blank.

# ── The resolved cannibalisation cluster (3 losers -> 1 device page + 2 concerns)
location = /exion-skin-tightening-in-the-bay-area/ {
    return 301 /treatments/exion-by-btl/;
}
location = /skin-tightening/ {
    return 301 /areas-of-concern/loose-skin/;
}
location = /non-surgical-neck-skin-tightening-in-san-anselmo/ {
    return 301 /areas-of-concern/turkey-neck/;
}

# ── 410, deliberately NOT a 301.
# A WordPress mega-menu custom post type published as a live indexable URL and
# md5-identical to index.html. A 301 would merge a duplicate into the page it
# duplicates; the URL should simply stop existing. Production currently returns
# 301 -> / which is precisely the merge being avoided, so this rule CHANGES
# current behaviour rather than adding to it.
location = /dt_mega_menus/megamenu-3/ {
    return 410;
}

# ── Not from the P5 ordinance. Added 2026-08-25 from the cutover census, which found this URL live
# and absent from the build. It is not a missing page: the prep page inventory folded the concern
# into the age-spots leaf ("Age spots / sun-induced pigmented lesions"), and the build's age-spots
# page covers it across nine sections. Redirecting rather than minting a 60th page keeps the two
# from competing for the same pigmentation terms — the cannibalisation the ordinance above exists
# to resolve.
location = /areas-of-concern/pigmented-lesions/ {
    return 301 /areas-of-concern/age-spots/;
}

# ── ALREADY IN FORCE, verified 2026-08-25 — do not duplicate:
#      /treatments/vanquish/  -> /treatments/vanquish-me/        (301, live)
#      /braintap-sessions/    -> /treatments/braintap-sessions/  (301, live)
#
# ── NOT IMPLEMENTED — owner decisions, see redirects.csv and README.md:
#      /book-an-appointment/    -> /consultation/
#      /emsculpt-neo-special/   -> /treatments/emsculpt-neo/
#      /emsculpt-neo-special//  -> /treatments/emsculpt-neo/
#
#   If the emsculpt promo rows are later approved, note that nginx normalises
#   repeated slashes before location matching (merge_slashes is on by default),
#   so `location = /emsculpt-neo-special//` will not match as written. Either set
#   `merge_slashes off;` or handle the variant in the WordPress layer instead.
